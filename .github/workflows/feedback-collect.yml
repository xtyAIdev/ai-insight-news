name: Feedback Collect

# 反馈闭环（2026-08-31 批3 任务⑥）：
# 读者在日报页脚点"反馈/纠错" → 预填 GitHub Issue（标题 [日报反馈] + 结构化 body 模板）→
# 本 workflow 在 issue 打开时解析结构化 body → 调用 `feedback:issue` 命令写入 data/feedback.json
# （appendFeedbackToFile，git add -f 提交回仓库持久化，跨 CI 留存）。
#
# 识别条件（2026-08-31 实测修正）：标题以 [日报反馈] 开头 **或** body 含模板特征字段 `**日报日期**`
# 才触发；两者都不含（普通讨论/告警/随手测试）不触发，避免误收集。
# 注意：GitHub Actions 的 job if 里 `contains(body, '**日报日期**')` 的 `**` 需按字符串比较处理。

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.issue.title, '[日报反馈]') ||
      contains(github.event.issue.body, '**日报日期**')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 解析 issue 结构化字段
        id: parse
        uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            // 模板字段：日报日期 / 反馈类型 / 涉及事件 / 评分(0-5) / 具体说明
            const body = process.env.ISSUE_BODY || '';
            // 字段名后允许带括号说明（如 "**评分**（0-5...）："），正则匹配到冒号为止
            const getField = (label) => {
              const m = body.match(new RegExp(`\\*\\*${label}\\*\\*[^\\n]*：([\\s\\S]*?)(?:\\n\\n|$)`));
              return m ? m[1].trim() : '';
            };
            const event = getField('涉及事件');
            const score = getField('评分').match(/\d(?:\.\d)?/)?.[0] || '';
            const suggestion = getField('具体说明');
            const types = getField('反馈类型');
            // 反馈类型：逗号分隔，去掉"如："示例说明与占位提示
            const tags = types
              .replace(/如：.*/, '')
              .replace(/（请填写[^）]*）/g, '')
              .split(/[、,，/]/)
              .map((t) => t.trim())
              .filter((t) => t && t.length > 0);

            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `event=${encodeURIComponent(event)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `score=${score}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tags=${tags.join(',')}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `suggestion=${encodeURIComponent(suggestion)}\n`);
            console.log(`[feedback] issue #${context.issue.number} | 事件 ${event || '(空)'} | 评分 ${score || '(空)'} | 类型 ${tags.join(',') || '(空)'}`);

      - name: 校验有效反馈
        id: validate
        run: |
          SCORE="${{ steps.parse.outputs.score }}"
          SUGGESTION="${{ steps.parse.outputs.suggestion }}"
          if [ -z "$SCORE" ] && [ -z "$SUGGESTION" ]; then
            echo "无评分且无说明 → 无效反馈，保留 issue 供人工跟进"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 写入 feedback.json 并提交
        if: steps.validate.outputs.valid == 'true'
        run: |
          EVENT="${{ steps.parse.outputs.event }}"
          SCORE="${{ steps.parse.outputs.score }}"
          TAGS="${{ steps.parse.outputs.tags }}"
          SUGGESTION="${{ steps.parse.outputs.suggestion }}"
          npm run build >/dev/null 2>&1
          node --experimental-sqlite dist/cli/index.js feedback:issue \
            --event "$EVENT" --score "$SCORE" --tags "$TAGS" --suggestion "$SUGGESTION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/feedback.json
          git diff --cached --quiet || git commit -m "chore: collect feedback issue #${{ github.event.issue.number }}"
          git push

      - name: 关闭已收集的反馈 issue
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
            console.log(`已关闭反馈 issue #${context.issue.number}`);
