name: Daily AI Insight Report

on:
  schedule:
    - cron: '17 0 * * *'   # 每天 UTC 00:17（北京时间 08:17）——避开整点峰值负载，降低 schedule 被静默跳过概率
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write          # 失败时自动建 issue 告警

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm        # 依赖缓存，加速 npm install

      - run: npm ci          # lockfile 精确安装（比 npm install 更快更稳）

      - name: 运行完整日报流程
        id: report
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        # --date 显式传入运行日期（runner 为 UTC，与 cron 自洽，避免手动触发时漂移）
        run: npm run build && node --experimental-sqlite dist/cli/index.js run --date "$(date +%F)"

      - name: 检查日报是否生成
        id: check
        run: |
          REPORT_DATE="$(date +%F)"
          if [ ! -d "reports/${REPORT_DATE}" ] || [ -z "$(ls reports/${REPORT_DATE}/*.html 2>/dev/null)" ]; then
            echo "::warning::报告未生成：reports/${REPORT_DATE} 为空或缺失"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交日报归档回仓库（保留历史）
        if: steps.check.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/：star 快照等跨日状态（周增长计算依赖历史快照，必须随仓库持久化）
          git add -f reports/ state/ 2>/dev/null || git add -f reports/
          git diff --cached --quiet || git commit -m "chore: daily report $(date +%F)"
          git push

      - name: 生成静态站点（当日日报全文 + 全量归档）
        run: node scripts/build-site.mjs

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 失败告警：日报流程失败时自动建 issue，避免静默失败
  alert:
    if: failure() && github.event_name == 'schedule'
    needs: [report, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 创建失败告警 issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
            });
            const todayIssue = issues.find(i => i.title.includes(`日报生成失败 ${date}`));
            if (todayIssue) {
              console.log(`今日告警已存在：#${todayIssue.number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 日报生成失败 ${date}`,
              body: `**每日自动化日报生成失败**\n\n- 运行：[${context.runId}](${runUrl})\n- 时间：${new Date().toISOString()}\n\n请检查 Actions 日志定位原因。若为临时网络/API 故障，可手动重新触发。`,
            });
            console.log('已创建告警 issue');
